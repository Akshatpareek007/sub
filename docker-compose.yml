version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_erp_crm_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./data/dev.db
      - JWT_SECRET=super-secret-jwt-key-erp-crm-2026
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/backend/data
    restart: unless-stopped

volumes:
  sqlite_data:
